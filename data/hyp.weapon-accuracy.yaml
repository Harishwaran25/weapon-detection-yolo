# Accuracy-focused fine-tune hyps for weapon detection (gun / heavy-weapon / knife)
# Lower LR (continuing from models/best.pt), stronger classification + focal loss
# for rare knife class, richer geometric aug for small/thin weapons.

lr0: 0.003
lrf: 0.01
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 2.0
warmup_momentum: 0.8
warmup_bias_lr: 0.05
box: 0.05
cls: 1.0
cls_pw: 1.5
obj: 1.0
obj_pw: 1.0
iou_t: 0.20
anchor_t: 4.0
fl_gamma: 1.5
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 12.0
translate: 0.15
scale: 0.9
shear: 3.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 1.0
mixup: 0.15
copy_paste: 0.0
